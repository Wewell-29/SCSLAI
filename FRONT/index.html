<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCSLAI</title>
    <meta name="description" content="Visit the official website of the Supreme Court Savings and Loan Association, Inc. (SCSLAI) for membership information, loan services, forms, and announcements.">
    <link rel="icon" type="image/png" href="favicon.png">
    <!-- Coin loader — page-load + every wait on the site (loading/coin-loader.js).
         Loaded first so the coin is already up while the rest of the page is
         still coming down the wire. -->
    <link rel="stylesheet" href="loading/coin-loader.css?v=2">
    <script src="loading/coin-loader.js?v=2"></script>
    <link rel="stylesheet" href="style.css?v=20261109a">
    <!-- ANNIVERSARY GAMES (temporary) — switch hunts with ONE line in
         Games/game-control.js:  const ACTIVE_GAME = "star";  (or "heart").
         Delete the whole Games/ folder after the anniversary. -->
    <link rel="stylesheet" href="Games/star-game.css?v=20261109a">
    <link rel="stylesheet" href="Games/heart-game.css?v=20261109a">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="facebook-live.css?v=7">
    <!-- Welcome popup: the "A new way to connect with us" banner shown once
         before the visitor uses the site (× to close). Settings live in
         welcome-popup.js. -->
    <link rel="stylesheet" href="welcome-popup.css?v=2">
</head>
<body>

    <!-- Header -->
    <header></header>

    <!-- Hero Section -->
    <main>
        <div class="overlay">

            <div class="content">

                <!-- Announcement Section -->
                <section class="announcements">
                    <div class="title">
                        ANNOUNCEMENTS
                    </div>

                    <div class="announcement-posters">
                        <img alt="">
                        <button class="announcement-control prev" type="button" aria-label="Previous announcement">&#8249;</button>
                        <button class="announcement-control next" type="button" aria-label="Next announcement">&#8250;</button>
                        <div class="announcement-dots" role="tablist" aria-label="Announcement navigation"></div>
                    </div>
                </section>

                <!-- Right Side -->
                <section class="right-section">

                    <div class="featured-banner">
                        <div class="carousel">
                            <!-- Optional Philippine time schedule: YYYY-MM-DDTHH:MM:SS+08:00 -->
                            <div class="carousel-slide active" data-start-date-time="" data-end-date-time="">
                                <img src="images/carousel/petty.png" alt="Featured slide 1" decoding="async">
                                <div class="slide-caption">PETTY</div>
                            </div>
                            <div class="carousel-slide" data-start-date-time="" data-end-date-time="">
                                <img data-src="images/carousel/EDU1.png" alt="Featured slide 2" decoding="async">
                                <div class="slide-caption">EDUCATION</div>
                            </div>
                            <div class="carousel-slide" data-start-date-time="" data-end-date-time="">
                                <img data-src="images/carousel/Business Loan.png" alt="Featured slide 4" decoding="async">
                                <div class="slide-caption">BUSINESS</div>
                            </div>
                            <div class="carousel-slide" data-start-date-time="" data-end-date-time="">
                                <img data-src="images/carousel/Housing Loan.png" alt="Featured slide 5" decoding="async">
                                <div class="slide-caption">HOUSING</div>
                            </div>
                        </div>
                        <button class="carousel-control prev" type="button">‹</button>
                        <button class="carousel-control next" type="button">›</button>
                    </div>

                    <!-- EVENTS — cover cards built from eventsData in script.js -->
                    <section class="events-section" aria-labelledby="events-title">
                        <div class="events-head">
                            <div>
                                <h2 class="events-title" id="events-title">Events &amp; Activities</h2>
                                <p class="events-subtitle">Moments that bring our members and community together.</p>
                            </div>
                            <button type="button" class="events-viewall" data-events-viewall hidden>View All Events &rarr;</button>
                        </div>
                        <div class="events-grid" data-events-grid></div>
                    </section>

                </section>
            </div>

        </div>
    </main>

    <!-- EVENT ALBUM — opened by clicking an event card. The photo list for each
         event folder lives in events-albums.js. -->
    <div class="photo-lightbox" id="event-album" role="dialog" aria-modal="true" aria-label="Event album" hidden>
        <div class="photo-lightbox-backdrop" data-close-album></div>
        <figure class="photo-lightbox-panel">
            <button type="button" class="photo-lightbox-close" data-close-album aria-label="Close album">&times;</button>
            <button type="button" class="photo-lightbox-nav photo-lightbox-prev" data-album-prev aria-label="Previous photo">&#8249;</button>
            <img class="photo-lightbox-image" data-album-image src="" alt="">
            <button type="button" class="photo-lightbox-nav photo-lightbox-next" data-album-next aria-label="Next photo">&#8250;</button>
            <figcaption class="photo-lightbox-caption">
                <span data-album-caption></span>
                <span class="photo-lightbox-counter" data-album-counter></span>
            </figcaption>
            <!-- Thumbnail strip: one button per photo, built by script.js. -->
            <div class="photo-lightbox-strip" data-album-strip role="group" aria-label="Album photos" hidden></div>
        </figure>
    </div>

    <!-- Footer -->
    <footer></footer>

    <script src="welcome-popup.js?v=2"></script>
    <script src="events-albums.js?v=1"></script>
    <script src="shared-shell.js?v=20261123a"></script>
    <script src="script.js?v=20261030a"></script>
    <script src="Games/game-control.js?v=20261109a"></script>
    <script src="Games/star-game.js?v=20261109a"></script>
    <script src="Games/heart-game.js?v=20261109a"></script>
    <script src="Games/game-watch.js?v=20261109a"></script>
    <script src="facebook-live.js?v=9"></script>
</body>
</html>
