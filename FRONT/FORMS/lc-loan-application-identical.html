<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LC Loan Application (PDF-Locked)</title>
    <style>
        :root {
            --paper-w: 612;
            --paper-h: 792;
            --scale: 1;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #e9edf0;
            font-family: Arial, sans-serif;
            color: #111;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.95);
            border-bottom: 1px solid #cfd7dd;
        }

        .topbar button {
            border: 0;
            border-radius: 4px;
            padding: 10px 14px;
            font-weight: 700;
            cursor: pointer;
            color: #fff;
        }

        #btnReset { background: #616161; }
        #btnPrint { background: #3f5664; }
        #btnDownloadData { background: #0b6b3a; }

        .shell {
            display: flex;
            justify-content: center;
            padding: 16px;
        }

        .paper {
            position: relative;
            width: min(100%, 980px);
            background: #fff;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
            overflow: hidden;
        }

        #pdfCanvas {
            width: 100%;
            height: auto;
            display: block;
            background: #fff;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 612px;
            height: 792px;
            transform-origin: top left;
            transform: scale(var(--scale));
            pointer-events: none;
        }

        .f {
            position: absolute;
            pointer-events: auto;
            font: 11px/1 Arial, sans-serif;
            color: #0c214f;
            background: rgba(255, 255, 255, 0.01);
            border: 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.18);
            padding: 1px 2px;
            outline: none;
        }

        .f:focus {
            background: rgba(206, 240, 223, 0.5);
            border-bottom-color: #0b6b3a;
        }

        .chk {
            position: absolute;
            pointer-events: auto;
            width: 13px;
            height: 13px;
            margin: 0;
            accent-color: #000;
        }

        textarea.f {
            resize: none;
            border: 1px solid rgba(0, 0, 0, 0.18);
            line-height: 1.2;
        }

        .hint {
            max-width: 980px;
            margin: 8px auto 0;
            padding: 0 16px 16px;
            color: #35424b;
            font-size: 13px;
        }

        @media print {
            .topbar,
            .hint {
                display: none;
            }

            body,
            .shell {
                background: #fff;
                padding: 0;
            }

            .paper {
                width: 100%;
                max-width: none;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <button id="btnReset" type="button">Reset</button>
        <button id="btnPrint" type="button">Print</button>
        <button id="btnDownloadData" type="button">Download Data</button>
    </div>

    <div class="shell">
        <div class="paper" id="paper">
            <canvas id="pdfCanvas" width="612" height="792"></canvas>
            <form class="overlay" id="overlayForm" autocomplete="off"></form>
        </div>
    </div>

    <p class="hint">This page is locked to the official LC PDF layout. Inputs are positioned directly on the form placeholders.</p>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.7.76/pdf.min.mjs" type="module"></script>
    <script type="module">
        import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.7.76/pdf.min.mjs";

        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.7.76/pdf.worker.min.mjs";

        const PDF_PATH = "./Lower Court (LC) Loan Application Form1 (1).pdf";
        const PAGE_W = 612;
        const PAGE_H = 792;

        const canvas = document.getElementById("pdfCanvas");
        const ctx = canvas.getContext("2d");
        const paper = document.getElementById("paper");
        const overlay = document.getElementById("overlayForm");

        const fields = [
            // Top checkboxes: regular
            ["chk_business", "chk", 38, 708],
            ["chk_educational", "chk", 38, 694],
            ["chk_emergency_rata", "chk", 38, 680],
            ["chk_housing", "chk", 38, 666],
            ["chk_help", "chk", 123, 708],
            ["chk_jdf", "chk", 123, 694],
            ["chk_maxi", "chk", 123, 680],
            ["chk_others", "chk", 123, 666],
            ["chk_multi", "chk", 210, 708],
            ["chk_meal", "chk", 210, 694],
            ["chk_salary", "chk", 210, 680],

            // Top checkboxes: special
            ["chk_deea_apr", "chk", 286, 708],
            ["chk_midyear", "chk", 286, 694],
            ["chk_anniv", "chk", 286, 680],
            ["chk_deea_oct", "chk", 376, 708],
            ["chk_yearend", "chk", 376, 694],
            ["chk_cashgift", "chk", 376, 680],

            ["receivedDate", "date", 472, 742, 120],

            ["chk_new", "chk", 190, 650],
            ["chk_consolidate", "chk", 270, 650],
            ["applicantName", "text", 78, 662, 220],
            ["loanAmount", "text", 338, 662, 135],
            ["loanYears", "number", 512, 662, 30],

            ["edpNumber", "text", 114, 604, 125],
            ["tin", "text", 350, 604, 125],
            ["birthdate", "date", 114, 568, 125],
            ["placeOfBirth", "text", 350, 568, 185],

            ["lastName", "text", 114, 676, 125],
            ["firstName", "text", 350, 676, 125],
            ["middleName", "text", 114, 640, 125],
            ["suffix", "text", 350, 640, 80],

            ["homeAddress", "text", 114, 497, 300],
            ["zipCode", "text", 428, 497, 62],
            ["signature", "text", 505, 525, 84],
            ["printedName", "text", 505, 488, 84],

            ["officeStation", "text", 114, 435, 120],
            ["region", "text", 350, 435, 60],
            ["position", "text", 430, 435, 62],

            ["appointmentStatus", "text", 114, 399, 125],
            ["contactNumber", "text", 350, 399, 70],
            ["emailAddress", "email", 430, 399, 160],

            ["endorserSignature", "text", 48, 332, 130],
            ["endorserMobile", "text", 206, 332, 90],
            ["endorserDesignation", "text", 315, 332, 110],
            ["endorserEdp", "text", 460, 332, 125],

            ["chk_without_case", "chk", 68, 465],
            ["chk_with_case", "chk", 68, 450],
            ["jibBy", "text", 42, 274, 110],

            ["leaveAsOf", "date", 203, 302, 118],
            ["vacationLeave", "text", 225, 287, 92],
            ["sickLeave", "text", 225, 273, 92],
            ["leaveTotal", "text", 225, 258, 92],
            ["leaveBy", "text", 225, 242, 92],

            ["edpAsOf", "date", 420, 302, 118],
            ["takeHomePay", "text", 443, 287, 92],
            ["monthlySalary", "text", 443, 273, 92],
            ["edpBy", "text", 443, 242, 92],

            ["totalDeductions", "text", 434, 106, 90],
            ["takeHomeAfterDeduction", "text", 434, 94, 90],

            ["chk_delivery_lbp", "chk", 186, 222],

            ["sblSalary", "text", 42, 74, 130],
            ["sblAllowances", "text", 42, 63, 130],
            ["sblCapital", "text", 42, 52, 130],
            ["sblOthers", "text", 42, 41, 130],
            ["sblValue", "text", 42, 30, 130],

            ["remarks", "textarea", 280, 72, 300, 58],
            ["loanProcessor", "text", 456, 26, 120],
            ["approvedBy", "text", 42, 26, 180],
            ["confirmedBy", "text", 242, 26, 180],

            ["otherTypeText", "text", 194, 686, 82]
        ];

        // Outstanding loans rows: amount, date, balance, current deduction, new deduction
        const rowStartY = 208;
        const rowGap = 10;
        const loans = [
            "SALARY", "MULTI-PURPOSE", "EDUCATIONAL", "MAXI", "BUSINESS", "HELP", "EMERGENCY RATA", "MEAL",
            "HOUSING", "JDF/ALLOWANCE", "EEA APRIL", "MID YEAR", "ANNIVERSARY", "EEA OCTOBER", "YEAR END", "CASH GIFT"
        ];

        loans.forEach((key, i) => {
            const y = rowStartY - i * rowGap;
            fields.push([`loan_${i}_amount`, "text", 190, y, 58]);
            fields.push([`loan_${i}_date`, "date", 254, y, 74]);
            fields.push([`loan_${i}_balance`, "text", 333, y, 58]);
            fields.push([`loan_${i}_current`, "text", 414, y, 52]);
            fields.push([`loan_${i}_new`, "text", 486, y, 52]);
        });

        function yToTop(y, h, type) {
            if (type === "chk") return PAGE_H - y - 11;
            return PAGE_H - y - h + 4;
        }

        function addField(def) {
            const [id, type, x, y, w = 90, h = 14] = def;
            let el;

            if (type === "textarea") {
                el = document.createElement("textarea");
                el.rows = 4;
                el.className = "f";
            } else if (type === "chk") {
                el = document.createElement("input");
                el.type = "checkbox";
                el.className = "chk";
            } else {
                el = document.createElement("input");
                el.type = type === "number" ? "number" : type;
                el.className = "f";
            }

            el.id = id;
            el.name = id;

            if (el.className === "f") {
                el.style.left = `${x}px`;
                el.style.top = `${yToTop(y, h, type)}px`;
                el.style.width = `${w}px`;
                el.style.height = `${Math.max(h, 14)}px`;
            } else {
                el.style.left = `${x}px`;
                el.style.top = `${yToTop(y, 12, type)}px`;
            }

            if (id.includes("Number") || id.includes("zip") || id.includes("Years") || id.includes("loan_") || id.includes("Amount") || id.includes("sbl")) {
                el.setAttribute("inputmode", "numeric");
            }

            overlay.appendChild(el);
        }

        function createOverlay() {
            fields.forEach(addField);

            // Checkbox exclusivity where required
            const pendingA = document.getElementById("chk_without_case");
            const pendingB = document.getElementById("chk_with_case");
            pendingA.addEventListener("change", () => { if (pendingA.checked) pendingB.checked = false; });
            pendingB.addEventListener("change", () => { if (pendingB.checked) pendingA.checked = false; });

            const appA = document.getElementById("chk_new");
            const appB = document.getElementById("chk_consolidate");
            appA.addEventListener("change", () => { if (appA.checked) appB.checked = false; });
            appB.addEventListener("change", () => { if (appB.checked) appA.checked = false; });
        }

        async function renderPdfBackground() {
            const loadingTask = pdfjsLib.getDocument(PDF_PATH);
            const pdf = await loadingTask.promise;
            const page = await pdf.getPage(1);

            const viewport = page.getViewport({ scale: 1 });
            canvas.width = viewport.width;
            canvas.height = viewport.height;

            await page.render({ canvasContext: ctx, viewport }).promise;
            updateScale();
        }

        function updateScale() {
            const scale = canvas.clientWidth / PAGE_W;
            document.documentElement.style.setProperty("--scale", String(scale));
            paper.style.minHeight = `${canvas.clientHeight}px`;
        }

        function collectData() {
            const data = {};
            fields.forEach(([id, type]) => {
                const el = document.getElementById(id);
                if (!el) return;
                data[id] = type === "chk" ? el.checked : el.value;
            });
            return data;
        }

        function resetForm() {
            overlay.reset();
        }

        function downloadData() {
            const data = collectData();
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "lc-loan-form-data.json";
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }

        document.getElementById("btnReset").addEventListener("click", resetForm);
        document.getElementById("btnPrint").addEventListener("click", () => window.print());
        document.getElementById("btnDownloadData").addEventListener("click", downloadData);

        window.addEventListener("resize", updateScale);

        createOverlay();
        renderPdfBackground().catch((error) => {
            console.error(error);
            alert("Unable to load PDF background. Make sure the template PDF is in the same FORMS folder.");
        });
    </script>
</body>
</html>
