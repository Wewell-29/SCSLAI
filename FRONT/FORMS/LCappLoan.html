<!-- LOAN APPLICATION MODAL -->
<div class="loan-modal" id="loanModal">

    <div class="loan-modal-content">

        <!-- MODAL HEADER -->
        <div class="loan-modal-header">

            <div>
                <h2>Loan Application</h2>
                <p>Enter your details to start your application.</p>
            </div>

            <button class="close-loan-modal" id="closeLoanModal">
                &times;
            </button>

        </div>


        <!-- MODAL BODY -->
        <div class="loan-modal-body">

            <form id="loanApplicationForm">

                <!-- LOAN INFORMATION -->
                <div class="modal-section">

                    <h3>Loan Information</h3>

                    <div class="modal-form-grid">

                        <div class="modal-form-group">

                            <label for="loanCategory">
                                Loan Category
                            </label>

                            <select id="loanCategory" required>

                                <option value="">
                                    Select Loan Category
                                </option>

                                <option value="regular">
                                    Regular Loan
                                </option>

                                <option value="special">
                                    Special Loan
                                </option>

                            </select>

                        </div>


                        <div class="modal-form-group">

                            <label for="loanType">
                                Type of Loan
                            </label>

                            <select id="loanType" required>

                                <option value="">
                                    Select Type of Loan
                                </option>

                            </select>

                        </div>


                        <div class="modal-form-group">

                            <label for="applicationType">
                                Application Type
                            </label>

                            <select id="applicationType" required>

                                <option value="">
                                    Select Application Type
                                </option>

                                <option value="New Loan">
                                    New Loan
                                </option>

                                <option value="Consolidate">
                                    Consolidate
                                </option>

                            </select>

                        </div>

                    </div>

                </div>


                <!-- PERSONAL INFORMATION -->
                <div class="modal-section">

                    <h3>Personal Information</h3>

                    <div class="modal-form-grid">

                        <div class="modal-form-group">

                            <label for="lastName">
                                Last Name
                            </label>

                            <input
                                type="text"
                                id="lastName"
                                required
                            >

                        </div>


                        <div class="modal-form-group">

                            <label for="firstName">
                                First Name
                            </label>

                            <input
                                type="text"
                                id="firstName"
                                required
                            >

                        </div>


                        <div class="modal-form-group">

                            <label for="middleName">
                                Middle Name
                            </label>

                            <input
                                type="text"
                                id="middleName"
                            >

                        </div>


                        <div class="modal-form-group">

                            <label for="suffix">
                                Suffix
                            </label>

                            <input
                                type="text"
                                id="suffix"
                                placeholder="Jr., Sr., III"
                            >

                        </div>


                        <div class="modal-form-group">

                            <label for="edpNumber">
                                EDP #
                            </label>

                            <input
                                type="text"
                                id="edpNumber"
                                required
                            >

                        </div>


                        <div class="modal-form-group">

                            <label for="tin">
                                TIN
                            </label>

                            <input
                                type="text"
                                id="tin"
                            >

                        </div>


                        <div class="modal-form-group">

                            <label for="birthdate">
                                Birthdate
                            </label>

                            <input
                                type="date"
                                id="birthdate"
                                required
                            >

                        </div>


                        <div class="modal-form-group">

                            <label for="placeOfBirth">
                                Place of Birth
                            </label>

                            <input
                                type="text"
                                id="placeOfBirth"
                                required
                            >

                        </div>

                    </div>

                </div>


                <!-- ADDRESS -->
                <div class="modal-section">

                    <h3>Address Information</h3>

                    <div class="modal-form-grid">

                        <div class="modal-form-group modal-full-width">

                            <label for="homeAddress">
                                Home Address
                            </label>

                            <input
                                type="text"
                                id="homeAddress"
                                required
                            >

                        </div>


                        <div class="modal-form-group">

                            <label for="zipCode">
                                ZIP Code
                            </label>

                            <input
                                type="text"
                                id="zipCode"
                                required
                            >

                        </div>

                    </div>

                </div>


                <!-- EMPLOYMENT -->
                <div class="modal-section">

                    <h3>Employment Information</h3>

                    <div class="modal-form-grid">

                        <div class="modal-form-group">

                            <label for="officeStation">
                                Office Station
                            </label>

                            <input
                                type="text"
                                id="officeStation"
                                required
                            >

                        </div>


                        <div class="modal-form-group">

                            <label for="region">
                                Region
                            </label>

                            <input
                                type="text"
                                id="region"
                                required
                            >

                        </div>


                        <div class="modal-form-group">

                            <label for="position">
                                Position
                            </label>

                            <input
                                type="text"
                                id="position"
                                required
                            >

                        </div>


                        <div class="modal-form-group">

                            <label for="appointment">
                                Appointment
                            </label>

                            <input
                                type="text"
                                id="appointment"
                                required
                            >

                        </div>

                    </div>

                </div>


                <!-- CONTACT -->
                <div class="modal-section">

                    <h3>Contact Information</h3>

                    <div class="modal-form-grid">

                        <div class="modal-form-group">

                            <label for="contactNumber">
                                Contact Number
                            </label>

                            <input
                                type="tel"
                                id="contactNumber"
                                required
                            >

                        </div>


                        <div class="modal-form-group">

                            <label for="emailAddress">
                                Email Address
                            </label>

                            <input
                                type="email"
                                id="emailAddress"
                                required
                            >

                        </div>

                    </div>

                </div>


                <!-- ACTIONS -->
                <div class="modal-actions">

                    <button
                        type="button"
                        class="modal-cancel-btn"
                        id="cancelLoanModal"
                    >
                        Cancel
                    </button>


                    <button
                        type="submit"
                        class="modal-submit-btn"
                    >
                        Continue
                        <i class="fas fa-arrow-right"></i>
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
